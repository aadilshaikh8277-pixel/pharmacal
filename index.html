* {

}

body {

    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {

    color: white;

header h1 {

}

header p {

}

.layout {
    display: flex;
    min-height: calc(100vh - 90px);
}

.sidebar {
    width: 240px;
    background: var(--card);
    padding: 15px;
    border-right: 1px solid var(--border);
}

.sidebar button {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 8px;
    border: none;
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.sidebar button:hover {
    background: var(--primary);
    color: white;
}

main {
    flex: 1;
    padding: 25px;
    min-width: 0;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
}

.stat {
    font-size: 28px;
    font-weight: bold;
    color: var(--primary);
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
}

label {
    font-weight: bold;
}

.primary-btn {
    background: var(--primary);
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.result {
    margin-top: 15px;
    padding: 15px;
    background: var(--bg);
    border-left: 4px solid var(--primary);
    border-radius: 7px;
    font-weight: bold;
}

.disclaimer {
    margin-top: 25px;
    padding: 15px;
    background: #fff3cd;
    color: #664d03;
    border-radius: 8px;
    line-height: 1.6;
    font-size: 13px;
}

footer {
    padding: 20px;
    text-align: center;
    color: var(--text);
    border-top: 1px solid var(--border);
}

button:focus, input:focus, select:focus {
    outline: 2px solid var(--primary);
}

@media(max-width: 700px) {
    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border-right: none;
    }

    main {
        padding: 15px;
    }
}
</style>

<input type="number" id="volume" placeholder="Enter volume in litres">

<input type="number" id="volume" placeholder="Enter volume in litres">

button = "calculateNormality";

else if(type === "dilution") {

title = "Dilution Calculator";

fields = `

// ===============================
// CALCULATION FUNCTIONS
// ===============================

function showResult(message) {

document.getElementById("result").innerHTML =
`<div class="result">${message}</div>`;

saveHistory(message);

}

function calculateBMI() {

let w = Number(document.getElementById("weight").value);
let h = Number(document.getElementById("height").value);

if(w <= 0 || h <= 0) {
return showResult("Please enter valid weight and height.");
}

let bmi = w / ((h / 100) ** 2);

let category =
bmi < 18.5 ? "Underweight" :
bmi < 25 ? "Normal range" :
bmi < 30 ? "Overweight" : "Obesity range";

showResult(`BMI: ${bmi.toFixed(2)} | Category: ${category}`);

}

function calculateMolarity() {

let n = Number(document.getElementById("moles").value);
let v = Number(document.getElementById("volume").value);

if(n < 0 || v <= 0) {
return showResult("Please enter valid values.");
}

let result = n / v;

showResult(`Molarity = ${result.toFixed(4)} mol/L (M)`);

}

function calculateNormality() {

let eq = Number(document.getElementById("equivalents").value);
let v = Number(document.getElementById("volume").value);

if(eq < 0 || v <= 0) {
return showResult("Please enter valid values.");
}

let result = eq / v;

showResult(`Normality = ${result.toFixed(4)} eq/L (N)`);

}

function calculateDilution() {

let c1 = Number(document.getElementById("c1").value);
let v1 = Number(document.getElementById("v1").value);
let v2 = Number(document.getElementById("v2").value);

if(c1 <= 0 || v1 <= 0 || v2 <= 0 || v2 < v1) {
return showResult("Please enter valid dilution values.");
}

let c2 = (c1 * v1) / v2;

showResult(`Final concentration (C2) = ${c2.toFixed(4)}`);

}

function calculatePH() {

let h = Number(document.getElementById("hplus").value);

if(h <= 0) {
return showResult("Please enter a positive hydrogen ion concentration.");
}

let ph = -Math.log10(h);

showResult(`pH = ${ph.toFixed(4)}`);

}

function calculatePercentage() {

let g = Number(document.getElementById("grams").value);
let v = Number(document.getElementById("ml").value);

if(g < 0 || v <= 0) {
return showResult("Please enter valid values.");
}

let result = (g / v) * 100;

showResult(`Percentage w/v = ${result.toFixed(4)}%`);

}

function searchDrug() {

const search =
document.getElementById("drugSearch").value.toLowerCase();

const category =
document.getElementById("categoryFilter").value;

const sort =
document.getElementById("drugSort").value;

let results = drugDatabase.filter(drug =>

(drug.name.toLowerCase().includes(search) ||
drug.category.toLowerCase().includes(search)) &&

(!category || drug.category === category)

);

results.sort((a,b) =>

sort === "az"
? a.name.localeCompare(b.name)
: b.name.localeCompare(a.name)

);

document.getElementById("drugResult").innerHTML =

results.length

? results.map(drug => `

<div class="card">

<h3>💊 ${drug.name}</h3>

<p><b>Category:</b> ${drug.category}</p>

<p><b>Uses:</b> ${drug.use}</p>

<p><b>Mechanism of Action:</b> ${drug.moa}</p>

<p><b>Common Side Effects:</b> ${drug.sideEffects}</p>

<p><b>Precautions:</b> ${drug.precautions}</p>

</div>

`).join("")

: "<p>No medicines found.</p>";

}

function saveHistory(message) {

let history = JSON.parse(
localStorage.getItem("pharmaHistory") || "[]"
);

history.unshift({
message: message,
date: new Date().toLocaleString()
});

history = history.slice(0,50);

localStorage.setItem(
"pharmaHistory",
JSON.stringify(history)
);

}


function showHistory() {

let history = JSON.parse(
localStorage.getItem("pharmaHistory") || "[]"
);

document.getElementById("content").innerHTML = `

<h2>🕘 Calculation History</h2>

<button class="primary-btn" onclick="clearHistory()">
Clear History
</button>

<div style="margin-top:20px;">

${history.length ?

history.map(item => `

<div class="card">

<p>${item.message}</p>

<small>${item.date}</small>

</div>

`).join("")

: "<p>No calculation history available.</p>"}

</div>

`;

}


function clearHistory() {

if(confirm("Are you sure you want to clear history?")) {

localStorage.removeItem("pharmaHistory");

showHistory();

}

}
